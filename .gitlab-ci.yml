stages:
  - build

build-test:
  stage: build
  image: dev-hthxharbor.utfinancing.com/base/node:18.12.1-slim
  tags:
    - kubernetes
  before_script:
    - npm set cache /home/cache/npm/
    - yarn config set cache /home/cache/npm/
    - npm set registry https://registry.npm.taobao.org
    - yarn config set registry https://registry.npm.taobao.org
    - docker login -u admin -p Harbor12345 https://dev-hthxharbor.utfinancing.com
  script:
    - cd /builds/chat-sd/chat-sd-frontend
    # - sleep infinity
    - yarn install
    - npm run build
    - mv dist chat-sd-frontend
    - tar -zcvf chat-sd-frontend.tgz chat-sd-frontend
    - mv chat-sd-frontend.tgz .deploy/ && cd .deploy/
    - docker build -t dev-hthxharbor.utfinancing.com/chat-ai/chat-sd-frontend-busybox:tmp .
  after_script:
    - docker push dev-hthxharbor.utfinancing.com/chat-ai/chat-sd-frontend-busybox:tmp
